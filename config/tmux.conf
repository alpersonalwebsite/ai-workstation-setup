# ~/.tmux.conf

# ---------------------------------------------------------------------------
# Plugins (all from the tmux-plugins org, all run locally, no telemetry).
# TPM only touches the network when YOU install/update plugins (git pull).
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'             # plugin manager
set -g @plugin 'tmux-plugins/tmux-sensible'   # sane, uncontroversial defaults
set -g @plugin 'tmux-plugins/tmux-yank'       # copy selection to system clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'  # save/restore sessions + layout
set -g @plugin 'tmux-plugins/tmux-continuum'  # auto-save + auto-restore

# --- resurrect / continuum behavior ---
set -g @continuum-restore 'on'                # auto-restore layout when tmux starts
set -g @continuum-save-interval '15'          # auto-save every 15 minutes
set -g @continuum-boot 'on'                   # start tmux at login (installs a LaunchAgent) so sessions restore after a reboot
set -g @resurrect-processes 'claude'          # also relaunch `claude` in restored panes

# Pane scrollback capture is OFF by default, and set explicitly rather than
# left to the plugin default so the choice is visible. Turning it on writes
# pane contents (whatever your terminal printed, which can include tokens, keys,
# or command output echoed by other tools) to ~/.local/share/tmux/resurrect/ in
# PLAINTEXT.
set -g @resurrect-capture-pane-contents 'off'
# Opt in by commenting the line above and uncommenting this one. Keep FileVault
# on if you do, so the saved scrollback is encrypted at rest.
# set -g @resurrect-capture-pane-contents 'on'

# --- quality-of-life settings ---
set -g mouse on                               # click panes/resize/scroll with the mouse
set -g history-limit 50000                    # big scrollback for long Claude sessions
set -g base-index 1                           # windows start at 1
setw -g pane-base-index 1                     # panes start at 1
set -g renumber-windows on                    # keep window numbers gapless
set -sg escape-time 10                        # snappier key response
set -g focus-events on
set -g set-clipboard on

# true color / 256 color for modern terminals (iTerm2, etc.)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,iTerm.app:RGB"

# quick config reload:  prefix + r
unbind r
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ---------------------------------------------------------------------------
# Initialize TPM  (keep this line at the very bottom)
# ---------------------------------------------------------------------------
run '~/.tmux/plugins/tpm/tpm'
