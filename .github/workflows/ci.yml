name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Shell lint and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # jq is installed explicitly rather than relied on as a runner default:
      # statusline.sh hard-requires it, and the launcher assertion below would
      # otherwise pass or fail for reasons unrelated to this repo's code.
      - name: Install shellcheck, zsh and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh jq

      # Every bash script shipped here, not just setup.sh. The hooks and the
      # status line were unlinted while being the parts that run on every
      # session, write and prompt render, and two of the hooks are the secret
      # scanners. Globbed rather than listed so a new script is covered on
      # arrival.
      #
      # The guard tests the ONLY array that can be empty, the glob's own, and
      # tests it two ways. Counting a list that also holds literals cannot work:
      # with claude/hooks/ emptied, `(setup.sh claude/statusline.sh
      # claude/hooks/*.sh)` measures 3 under default bash (the glob stays
      # literal) and 2 under nullglob, so a count-is-zero test never fires and
      # the nullglob case silently lints two files and reports green. The `-e`
      # test is what catches the literal case, rather than relying on shellcheck
      # to happen to error on a filename that does not exist.
      - name: shellcheck bash scripts
        run: |
          set -euo pipefail
          hooks=(claude/hooks/*.sh)
          if [ ${#hooks[@]} -eq 0 ] || [ ! -e "${hooks[0]}" ]; then
            echo "::error::no hook scripts matched, the glob is wrong"
            exit 1
          fi
          files=(setup.sh claude/statusline.sh "${hooks[@]}")
          printf 'linting %s\n' "${files[@]}"
          shellcheck --severity=style "${files[@]}"

      - name: bash -n (syntax)
        run: |
          set -euo pipefail
          hooks=(claude/hooks/*.sh)
          if [ ${#hooks[@]} -eq 0 ] || [ ! -e "${hooks[0]}" ]; then
            echo "::error::no hook scripts matched, the glob is wrong"
            exit 1
          fi
          for f in setup.sh claude/statusline.sh "${hooks[@]}"; do
            bash -n "$f"
          done

      - name: zsh -n (syntax)
        run: zsh -n config/claude-proj.zsh

      # A broken example config is a bad first experience for anyone following
      # the install steps, and it is one command to prevent.
      - name: settings.example.json is valid JSON
        run: python3 -m json.tool claude/settings.example.json > /dev/null

      # statusline.sh is the one shipped script whose OUTPUT is the product, and
      # its first field fails in the direction that looks correct: break the
      # CLAUDE_LAUNCHER/CLAUDE_CONFIG_DIR resolution and every session prints
      # "claude", which is also the right answer for a plain run. shellcheck
      # cannot see that, and neither can a reviewer skimming the diff, so assert
      # the label instead of trusting the code to keep meaning what it says.
      # The last case is the degenerate one: a config dir ending in a dot leaves
      # nothing after the dot is stripped, and a blank first field reads as a
      # broken script rather than a mislabeled session.
      - name: Assert the status line's launcher field
        run: |
          set -euo pipefail
          json='{"model":{"display_name":"M"},"context_window":{"used_percentage":1},"cost":{"total_cost_usd":0}}'
          check() {  # $1 expected label, rest: environment for the run
            got=$(env -u CLAUDE_LAUNCHER -u CLAUDE_CONFIG_DIR "${@:2}" \
                    bash claude/statusline.sh <<<"$json" | awk '{print $1}')
            if [ "$got" != "$1" ]; then
              echo "::error file=claude/statusline.sh::launcher expected [$1], got [$got], for: ${*:2}"
              exit 1
            fi
            printf '  ok  %-18s %s\n' "$1" "${*:2}"
          }
          check claude
          check claude           CLAUDE_CONFIG_DIR="$HOME/.claude"
          check claude-extension CLAUDE_CONFIG_DIR="$HOME/.claude-extension"
          check claude-extension CLAUDE_CONFIG_DIR="$HOME/.claude-extension/"
          check mytag            CLAUDE_LAUNCHER=mytag CLAUDE_CONFIG_DIR="$HOME/.claude-extension"
          check claude           CLAUDE_LAUNCHER= CLAUDE_CONFIG_DIR="$HOME/.claude"
          check claude           CLAUDE_CONFIG_DIR=.

      # The shipped default must stay 'off'. A public repo should not turn
      # every cloner's terminal scrollback into a plaintext file on disk.
      - name: Assert pane-capture ships disabled
        run: |
          if ! grep -qx "set -g @resurrect-capture-pane-contents 'off'" config/tmux.conf; then
            echo "::error file=config/tmux.conf::pane-capture must ship set to 'off'"
            exit 1
          fi
          if grep -qE "^\s*set -g @resurrect-capture-pane-contents 'on'" config/tmux.conf; then
            echo "::error file=config/tmux.conf::the 'on' variant must stay commented out"
            exit 1
          fi

      # Catches a bumped TPM_VERSION whose TPM_COMMIT was not updated with it.
      - name: Verify the TPM pin resolves to the recorded commit
        run: |
          version="$(grep -oE 'TPM_VERSION="[^"]+"' setup.sh | cut -d'"' -f2)"
          expected="$(grep -oE 'TPM_COMMIT="[^"]+"' setup.sh | cut -d'"' -f2)"
          # These are annotated tags, so resolve the peeled ref (^{}) to get the
          # commit. The bare ref returns the tag object, which never equals what
          # `git rev-parse HEAD` reports after a clone.
          actual="$(git ls-remote https://github.com/tmux-plugins/tpm "refs/tags/$version^{}" | cut -f1)"
          if [ -z "$actual" ]; then
            actual="$(git ls-remote https://github.com/tmux-plugins/tpm "refs/tags/$version" | cut -f1)"
          fi
          echo "tag=$version expected=$expected actual=$actual"
          if [ -z "$actual" ]; then
            echo "::error::tag $version not found upstream"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error file=setup.sh::TPM_COMMIT does not match tag $version upstream (moved tag?)"
            exit 1
          fi

  tmux-config:
    name: tmux config parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
      - name: Parse config on an isolated socket
        run: |
          # TPM is not installed here, so the run-shell line at the bottom is
          # expected to fail. Everything else must parse cleanly.
          out="$(tmux -L ci -f config/tmux.conf start-server 2>&1 || true)"
          echo "$out"
          if echo "$out" | grep -v 'tpm' | grep -qi 'error\|unknown\|invalid'; then
            echo "::error file=config/tmux.conf::config failed to parse"
            exit 1
          fi
          tmux -L ci kill-server 2>/dev/null || true

  anchors:
    name: Docs anchors resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The link job below deliberately skips anything starting with `#`, so it
      # validates file paths and says nothing about anchors. Two dead anchors in a
      # table of contents shipped green because of that gap: removing `(+` or `/`
      # from a heading leaves two adjacent spaces, and GitHub emits a hyphen for
      # each one, so `#tmux-resurrect-...` never matched a heading whose real id is
      # `#tmux--resurrect-...`.
      #
      # github-slugger is the library GitHub uses, and it is a dependency here on
      # purpose: the hand-rolled reimplementation of these rules is what produced
      # the bad anchors AND passed its own verification, since hand-made slugs
      # checked against hand-made rules agree by construction. Pinned so a rules
      # change arrives as a deliberate bump.
      - name: Install github-slugger
        run: npm install --no-save --no-audit --no-fund github-slugger@2.0.0
      - name: Every in-repo markdown anchor matches a heading
        run: node .github/scripts/check-anchors.mjs $(git ls-files '*.md')

  links:
    name: Docs links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check relative markdown links
        run: |
          fail=0
          while IFS= read -r md; do
            dir="$(dirname "$md")"
            while IFS= read -r link; do
              [ -n "$link" ] || continue
              case "$link" in http*|\#*) continue ;; esac
              # Strip any #anchor before testing the path on disk.
              path="${link%%#*}"
              [ -n "$path" ] || continue
              if [ ! -e "$dir/$path" ]; then
                echo "::error file=$md::dead relative link: $link"
                fail=1
              fi
            done <<EOF
          $(grep -o '](\.\{0,2\}[^)]*)' "$md" | sed 's/^](//; s/)$//')
          EOF
          done <<EOF
          $(find . -name '*.md' -not -path './.git/*')
          EOF
          exit $fail

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
